# Nginx Reverse Proxy สำหรับ VPS นอกสหรัฐฯ (เช่น สิงคโปร์ / ญี่ปุ่น / ยุโรป)
# รองรับทั้ง REST (/fapi/*) และ WebSocket (/ws/*, /stream*)

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 443 ssl http2;
    server_name binance-proxy.example.com;

    # ใส่ path ของ SSL certificate (เช่น จาก Let's Encrypt / Certbot)
    # ssl_certificate     /etc/letsencrypt/live/binance-proxy.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/binance-proxy.example.com/privkey.pem;

    # REST API (/fapi/v1/...)
    location /fapi/ {
        proxy_pass https://fapi.binance.com;
        proxy_ssl_server_name on;
        proxy_set_header Host fapi.binance.com;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Real-IP "";
        proxy_read_timeout 30s;
    }

    # WebSocket Streams (/stream, /ws)
    location ~ ^/(stream|ws) {
        proxy_pass https://fstream.binance.com;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host fstream.binance.com;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Real-IP "";
        proxy_read_timeout 3600s;
    }

    location /health {
        return 200 '{"ok":true}';
        add_header Content-Type application/json;
    }
}
